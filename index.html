<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevLeads — Zova Digital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const STATUSES = ["New","Contacted","Replied","Interested","Meeting Booked","Not Interested","Follow Up Later","Closed/Won","Closed/Lost"];
const STATUS_COLORS = {"New":"bg-blue-100 text-blue-800","Contacted":"bg-yellow-100 text-yellow-800","Replied":"bg-purple-100 text-purple-800","Interested":"bg-green-100 text-green-800","Meeting Booked":"bg-emerald-100 text-emerald-800","Not Interested":"bg-red-100 text-red-800","Follow Up Later":"bg-orange-100 text-orange-800","Closed/Won":"bg-green-200 text-green-900","Closed/Lost":"bg-gray-200 text-gray-700"};
const CLOUD_API = "https://zova-api.vercel.app/api/leads";

function requestNotifications() {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}

async function cloudSave(leads, history) {
  try {
    await fetch(CLOUD_API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ leads, history })
    });
  } catch(e) {}
}

function exportLeads(leads) {
  const blob = new Blob([JSON.stringify(leads, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "zova-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importLeads(file, currentLeads, onSave) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      const existingIds = new Set(currentLeads.map(l => l.id));
      const fresh = imported.filter(l => !existingIds.has(l.id));
      onSave([...fresh, ...currentLeads]);
      alert("Imported " + fresh.length + " leads.");
    } catch { alert("Invalid file."); }
  };
  reader.readAsText(file);
}

function useStorage() {
  const [leads, setLeads] = useState([]);
  const [history, setHistory] = useState([]);
  useEffect(() => {
    try {
      const l = localStorage.getItem("zova_v5_leads");
      const h = localStorage.getItem("zova_v5_history");
      if (l) setLeads(JSON.parse(l));
      if (h) setHistory(JSON.parse(h));
    } catch {}
    fetch(CLOUD_API).then(r => r.json()).then(data => {
      if (data && data.leads && data.leads.length > 0) {
        setLeads(data.leads);
        setHistory(data.history || []);
        try { localStorage.setItem("zova_v5_leads", JSON.stringify(data.leads)); } catch {}
      }
    }).catch(() => {});
    requestNotifications();
  }, []);
  const save = (nl) => {
    setLeads(nl);
    cloudSave(nl, history);
    try { localStorage.setItem("zova_v5_leads", JSON.stringify(nl)); } catch {}
  };
  const addHistory = (q) => {
    const h = [q, ...history.filter(x => x !== q)].slice(0, 50);
    setHistory(h);
    cloudSave(leads, h);
    try { localStorage.setItem("zova_v5_history", JSON.stringify(h)); } catch {}
  };
  return { leads, save, history, addHistory };
}

async function callClaude(system, userMsg, maxTokens) {
  const r = await fetch("https://zova-api.vercel.app/api/claude", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens || 1000, system, messages: [{ role: "user", content: userMsg }] })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d?.error?.message || "API error");
  return d.content?.find(b => b.type === "text")?.text || "";
}

async function searchBusinesses(niche, city) {
  const r = await fetch("https://zova-api.vercel.app/api/places?query=" + encodeURIComponent(niche + " in " + city));
  if (!r.ok) throw new Error("Search error " + r.status);
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  const places = data.places || [];
  if (!places.length) throw new Error("No results found.");
  return places.map((p, i) => ({
    id: Date.now() + "_" + i + "_" + Math.random().toString(36).slice(2),
    name: p.displayName?.text || "Unknown",
    address: p.formattedAddress || "",
    rating: p.rating || null,
    reviewCount: p.userRatingCount || 0,
    category: p.primaryTypeDisplayName?.text || niche,
    website: p.websiteUri || null,
    phone: p.nationalPhoneNumber || null,
    websiteQuality: p.websiteUri ? "unknown" : "none",
    isGo3: p.websiteUri ? p.websiteUri.includes("go3") : false,
    status: "New", checked: false, analysis: null,
    outreach: {}, followUpDate: null, emailReminderDate: null,
    userNotes: "", contactLog: [],
    manualWebsite: null, manualInstagram: null,
    addedAt: new Date().toISOString(), searchQuery: niche + " in " + city
  }));
}

async function analyzeLead(lead) {
  const isGo3 = lead.isGo3 || (lead.website || "").includes("go3");
  const text = await callClaude(
    "Lead analyst for Zova Digital (NYC web/app/AI developer). Return ONLY raw JSON, no markdown.",
    "Analyze prospect:\nName: " + lead.name + "\nType: " + lead.category + "\nRating: " + lead.rating + " stars, " + lead.reviewCount + " reviews\nWebsite: " + (lead.website || "NONE") + " (quality: " + (lead.manualWebsite || lead.websiteQuality) + ")\nInstagram: " + (lead.manualInstagram || "unknown") + (isGo3 ? "\nIMPORTANT: Site is on Go3 Technology template." : "") + "\n\nReturn JSON: {\"score\":85,\"pitchAngle\":\"specific pitch for this business\",\"biggestOpportunity\":\"what to build\",\"websiteOpp\":\"High\",\"appOpp\":\"Medium\",\"appIdea\":\"idea or null\",\"aiAutomation\":\"specific AI opportunity\",\"aiPitch\":\"one sentence\",\"isGo3Site\":" + isGo3 + ",\"go3Pitch\":\"Go3 pitch or null\",\"competitorAngle\":\"what competitors have\",\"problems\":[\"problem 1\",\"problem 2\"],\"summary\":\"2 sentences\"}",
    1200
  );
  return JSON.parse(text.match(/\{[\s\S]*\}/)[0]);
}

async function generateOutreach(lead, channel, analysis) {
  const short = channel === "Instagram DM" || channel === "Facebook DM";
  const isGo3 = lead.isGo3 || (lead.website || "").includes("go3");
  return await callClaude(
    "Write the best cold outreach message Ethan from Zova Digital has ever sent. Sound like a real local person who did homework on this business. No fake compliments. No generic openers. Lead with what they don't know they're losing. Return ONLY the message.",
    "Write a " + channel + " message. " + (short ? "2-3 sentences MAX." : "4-6 sentences.") + "\n\nBusiness: " + lead.name + " (" + lead.category + ")\nAddress: " + lead.address + "\nRating: " + lead.rating + " stars, " + lead.reviewCount + " reviews\nWebsite: " + (isGo3 ? "Go3 template" : lead.manualWebsite || (lead.website ? lead.websiteQuality : "none")) + "\nInstagram: " + (lead.manualInstagram || "unknown") + "\n\nAnalysis:\n- Pitch: " + (analysis?.pitchAngle || "needs better web presence") + "\n- Opportunity: " + (analysis?.biggestOpportunity || "unknown") + "\n- AI automation: " + (analysis?.aiAutomation || "unknown") + "\n- Competitor angle: " + (analysis?.competitorAngle || "unknown") + "\n- Problems: " + (analysis?.problems?.join(", ") || "unknown") + (isGo3 ? "\n- Go3 pitch: " + (analysis?.go3Pitch || "Go3 template upgrade") : "") + "\n\n" + (channel === "Email" ? "Start with: Subject: [compelling subject]\n\n" : "") + "Sign off as Ethan, Zova Digital.",
    700
  );
}

async function fixMessage(original, instruction, lead, channel) {
  return await callClaude(
    "Fix this outreach message. Make ONLY the change requested. Return ONLY the fixed message.",
    "Original " + channel + " message:\n\"" + original + "\"\n\nWhat to fix: " + instruction + "\n\nBusiness: " + lead.name + " (" + lead.category + ")\nReturn ONLY the fixed message.",
    500
  );
}

async function generateFollowUp(lead, channel, prev) {
  return await callClaude(
    "Write a follow-up for Ethan at Zova Digital. 1-3 sentences. Human, not desperate. Return ONLY the message.",
    "Follow-up " + channel + ". Business: " + lead.name + ". Previous: \"" + prev.slice(0, 200) + "\". Sign as Ethan, Zova Digital.",
    250
  );
}

async function getIdeas(history) {
  const text = await callClaude(
    "Suggest NYC local business searches for a web/app developer. Return ONLY a JSON array of strings.",
    "Already searched: " + (history.length ? history.join(", ") : "nothing") + ". Suggest 12 fresh NYC searches. Return JSON array.",
    600
  );
  const m = text.match(/\[[\s\S]*\]/);
  return m ? JSON.parse(m[0]) : [];
}

function getCallScript(lead, analysis) {
  const isGo3 = lead.isGo3 || (lead.website || "").includes("go3");
  const noWebsite = !lead.website || lead.websiteQuality === "none";
  return {
    opener: "Step 1 — When someone answers:\n\"Hi there, quick question — is the owner or whoever handles the business decisions around today?\"\n\nIf owner isn't there:\n\"No problem at all — when's usually a good time to catch them? I just had something quick I wanted to run by them about the business.\"",
    hook: noWebsite
      ? "Step 2 — When you get the owner:\n\"Hey, my name's Ethan — I'll keep this short. I was looking up " + lead.category + " spots in your area and noticed " + lead.name + " doesn't have a website. I build sites for local businesses and I've helped places just like yours go from invisible on Google to getting new clients every week. I'd love to show you what that could look like — takes two minutes.\""
      : isGo3
      ? "Step 2 — When you get the owner:\n\"Hey, my name's Ethan — real quick. I checked out your website and it looks like it's on Go3. I specialize in replacing those with fully custom sites that rank better on Google and actually convert visitors into customers. The difference is pretty dramatic — I'd love to show you an example.\""
      : "Step 2 — When you get the owner:\n\"Hey, my name's Ethan — I'll be quick. I looked at " + lead.name + " online and noticed " + (analysis?.pitchAngle || "some opportunities to get more customers online") + ". I build custom websites and apps for local businesses and I think there's a real opportunity here. Can I show you one example? Takes two minutes.\"",
    objections: [
      { q: "We already have a website", a: "\"I actually saw it — that's partly why I called. Is it bringing you consistent new customers from Google search, or is it more just sitting there? Most business sites I look at aren't doing much. I could take a quick look and tell you honestly if there's anything worth changing.\"" },
      { q: "We're not interested", a: "\"Totally fair — can I ask real quick, is it more about timing or just not a priority right now? I work with a lot of small businesses and I'm pretty flexible. If it's not the right time I can follow up down the road, no pressure.\"" },
      { q: "We have a team for this", a: "\"That's great — out of curiosity, are they doing anything with AI automation? Things like AI phone assistants or automated review systems? That's where I'm seeing the biggest impact right now for local businesses, and a lot of teams haven't gotten there yet.\"" },
      { q: "How much does it cost?", a: "\"Honestly it depends on what you need — I don't have one set price because every business is different. But I'd rather show you the work first before we even talk numbers. If it's not a fit I'll tell you straight up. Can I send you a quick example?\"" },
      { q: "Call back later / busy", a: "\"Of course — what's a good time, today later or tomorrow morning? I just need five minutes.\"" },
      { q: "We tried this before and it didn't work", a: "\"I hear that a lot actually. What didn't work about it — was it the site itself or just not getting traffic to it? Because those are two different problems and I'd want to make sure whatever I show you actually addresses the right one.\"" },
    ],
    close: "\"Here's what I'll do — let me send you a quick example of what I'd build for " + lead.name + ". Takes two seconds to look at. If you like it we can talk, if not no hard feelings. What's the best email or number to send it to?\""
  };
}

function CopyBtn({ text }) {
  const [c, setC] = useState(false);
  return (
    <button onClick={() => { navigator.clipboard.writeText(text); setC(true); setTimeout(() => setC(false), 2000); }}
      className="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-semibold">
      {c ? "Copied!" : "Copy"}
    </button>
  );
}

function ScoreRing({ score }) {
  const c = score >= 75 ? "#22c55e" : score >= 50 ? "#f59e0b" : "#ef4444";
  return (
    <div className="flex flex-col items-center gap-0.5 flex-shrink-0">
      <div className="w-14 h-14 rounded-full flex items-center justify-center"
        style={{ background: "conic-gradient(" + c + " " + score + "%, #e5e7eb " + score + "%)" }}>
        <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-sm font-black" style={{ color: c }}>{score}</div>
      </div>
      <div className="text-xs text-gray-400">score</div>
    </div>
  );
}

function LeadCard({ lead, onClick, onCheck }) {
  const isGo3 = lead.isGo3 || (lead.website || "").includes("go3");
  const noSite = !lead.website || lead.websiteQuality === "none";
  return (
    <div className="bg-white border border-gray-100 rounded-2xl p-4 hover:shadow-md transition-all">
      <div className="flex items-start gap-3">
        <input type="checkbox" checked={lead.checked || false}
          onChange={e => { e.stopPropagation(); onCheck(lead.id); }}
          className="mt-1.5 w-4 h-4 flex-shrink-0 cursor-pointer" />
        <div className="flex-1 min-w-0 cursor-pointer" onClick={onClick}>
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <span className={"font-black text-base leading-tight " + (lead.checked ? "line-through text-gray-400" : "")}>{lead.name}</span>
            <span className={"text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 " + STATUS_COLORS[lead.status]}>{lead.status}</span>
            {isGo3 && <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-semibold">Go3</span>}
          </div>
          <div className="text-xs text-gray-400 mb-2 truncate">{lead.address}</div>
          <div className="flex items-center gap-3 text-xs flex-wrap">
            {lead.rating && <span className="text-gray-500">★ {lead.rating} ({(lead.reviewCount || 0).toLocaleString()})</span>}
            <span className={"font-semibold " + (noSite ? "text-red-500" : isGo3 ? "text-orange-500" : "text-gray-400")}>
              {noSite ? "No website" : isGo3 ? "Go3 template" : "Has website"}
            </span>
            {lead.archived && <button onClick={e => { e.stopPropagation(); onCheck(lead.id, true); }} className="text-xs text-blue-500 underline">Unarchive</button>}
          </div>
          {lead.analysis && <div className="mt-2 text-xs bg-black text-white rounded-lg px-2 py-1.5 inline-block">{lead.analysis.pitchAngle}</div>}
        </div>
        {lead.analysis
          ? <ScoreRing score={lead.analysis.score} />
          : <div onClick={onClick} className="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-[10px] text-gray-400 text-center p-1 flex-shrink-0 cursor-pointer">Tap to score</div>
        }
      </div>
    </div>
  );
}

function LeadModal({ lead, onClose, onUpdate }) {
  const [tab, setTab] = useState("overview");
  const [analyzing, setAnalyzing] = useState(false);
  const [genFor, setGenFor] = useState(null);
  const [genFuFor, setGenFuFor] = useState(null);
  const [fixing, setFixing] = useState(null);
  const [fixInput, setFixInput] = useState({});
  const [showScript, setShowScript] = useState(null);
  const [liveQ, setLiveQ] = useState("");
  const [liveA, setLiveA] = useState("");
  const [liveLoading, setLiveLoading] = useState(false);
  const [status, setStatus] = useState(lead.status);
  const [notes, setNotes] = useState(lead.userNotes || "");
  const a = lead.analysis;
  const isGo3 = lead.isGo3 || (lead.website || "").includes("go3");
  const script = getCallScript(lead, a);

  const doAnalyze = async () => {
    setAnalyzing(true);
    try { onUpdate({ ...lead, analysis: await analyzeLead(lead) }); }
    catch(e) { alert("Failed: " + e.message); }
    setAnalyzing(false);
  };

  const doGen = async (ch) => {
    setGenFor(ch);
    try { onUpdate({ ...lead, outreach: { ...lead.outreach, [ch]: await generateOutreach(lead, ch, a) } }); }
    catch(e) { alert("Failed: " + e.message); }
    setGenFor(null);
  };

  const doFix = async (ch) => {
    if (!fixInput[ch]?.trim()) return;
    setFixing(ch);
    try {
      const fixed = await fixMessage(lead.outreach[ch], fixInput[ch], lead, ch);
      onUpdate({ ...lead, outreach: { ...lead.outreach, [ch]: fixed } });
      setFixInput(prev => ({ ...prev, [ch]: "" }));
    } catch(e) { alert("Failed: " + e.message); }
    setFixing(null);
  };

  const doFu = async (ch) => {
    setGenFuFor(ch);
    try { onUpdate({ ...lead, outreach: { ...lead.outreach, [ch + "_fu"]: await generateFollowUp(lead, ch, lead.outreach?.[ch] || "") } }); }
    catch(e) { alert("Failed: " + e.message); }
    setGenFuFor(null);
  };

  const doLiveQA = async () => {
    if (!liveQ.trim()) return;
    setLiveLoading(true);
    try {
      const ans = await callClaude(
        "You are a real-time call coach for Ethan at Zova Digital. Give a SHORT, natural response Ethan can say RIGHT NOW on the phone. Max 2-3 sentences. Sound human.",
        "Ethan is on a call with " + lead.name + " (" + lead.category + "). They just said: \"" + liveQ + "\". What should Ethan say right now? Keep it brief and natural.",
        300
      );
      setLiveA(ans.trim());
    } catch(e) { alert("Failed: " + e.message); }
    setLiveLoading(false);
  };

  const markSent = (ch) => {
    const log = [...(lead.contactLog || []), { channel: ch, date: new Date().toLocaleDateString(), type: "outreach" }];
    const reminder = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
    onUpdate({ ...lead, contactLog: log, status: "Contacted", followUpDate: reminder });
    onClose();
  };

  const channels = [
    { key: "Email", label: "Email" },
  ];

  const upsell = [
    { num: 1, name: "Website", tag: "Start here", price: "$1,000-$2,500", monthly: null, desc: "Custom site from scratch. Mobile-ready, fast, professional.", when: "Pitch on first contact.", hot: !lead.website || lead.websiteQuality === "none" || isGo3 },
    { num: 2, name: "Monthly Retainer", tag: "Easy recurring", price: null, monthly: "$75-$150/mo", desc: "Hosting, updates, menu changes. ~30 min/month.", when: "Bundle with website from day one.", hot: true },
    { num: 3, name: "AI Phone Assistant", tag: "Big upsell", price: null, monthly: "$200-$400/mo", desc: "AI answers calls, takes orders via Bland.ai or Retell AI.", when: "After 30-60 days once they trust you.", hot: (a?.score || 0) >= 70 },
    { num: 4, name: "AI Website Chatbot", tag: "Add-on", price: null, monthly: "$100-$200/mo", desc: "Chat widget answering questions 24/7.", when: "Pitch alongside Phase 3.", hot: false },
    { num: 5, name: "Review Automation", tag: "Easy win", price: null, monthly: "$100/mo", desc: "Auto-texts customers asking for Google reviews.", when: "Great for businesses under 200 reviews.", hot: (lead.reviewCount || 0) < 200 },
  ];

  return (
    <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-50">
      <div className="bg-white w-full sm:max-w-2xl sm:rounded-2xl rounded-t-2xl shadow-2xl max-h-[93vh] flex flex-col">
        <div className="p-4 border-b border-gray-100 flex items-start justify-between gap-2 flex-shrink-0">
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <h2 className="font-black text-lg leading-tight">{lead.name}</h2>
              {isGo3 && <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-semibold">Go3</span>}
            </div>
            <p className="text-xs text-gray-400 truncate">{lead.address}</p>
            {lead.website && <a href={lead.website} target="_blank" rel="noreferrer" className="text-xs text-blue-500 truncate block mt-0.5">{lead.website}</a>}
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            {a && <ScoreRing score={a.score} />}
            <button onClick={onClose} className="text-gray-400 text-2xl leading-none ml-1">×</button>
          </div>
        </div>

        <div className="flex border-b border-gray-100 overflow-x-auto flex-shrink-0">
          {["overview", "outreach", "call", "follow-up", "upsell", "notes"].map(t => (
            <button key={t} onClick={() => setTab(t)}
              className={"px-3 py-3 text-xs font-semibold capitalize whitespace-nowrap " + (tab === t ? "border-b-2 border-black text-black" : "text-gray-400")}>
              {t === "call" ? "Call Script" : t}
            </button>
          ))}
        </div>

        <div className="overflow-y-auto flex-1 p-4 space-y-3">

          {tab === "overview" && (
            <div className="space-y-3">
              <div className="bg-white border border-gray-100 rounded-xl p-3">
                <div className="text-xs font-semibold text-gray-400 mb-2">Quick Links</div>
                <div className="flex flex-wrap gap-2">
                  {lead.website && <a href={lead.website} target="_blank" rel="noreferrer" className="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-semibold">Website</a>}
                  <a href={"https://www.google.com/search?q=" + encodeURIComponent(lead.name + " instagram")} target="_blank" rel="noreferrer" className="text-xs bg-pink-50 hover:bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg font-semibold">Find on Instagram</a>
                  <a href={"https://www.facebook.com/search/top?q=" + encodeURIComponent(lead.name)} target="_blank" rel="noreferrer" className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg font-semibold">Facebook</a>
                  <a href={"https://www.google.com/search?q=" + encodeURIComponent(lead.name + " " + lead.address)} target="_blank" rel="noreferrer" className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg font-semibold">Google</a>
                  {lead.phone && <a href={"tel:" + lead.phone} className="text-xs bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg font-semibold">Call {lead.phone}</a>}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                {[["Rating", lead.rating ? lead.rating + " stars" : "None"], ["Reviews", (lead.reviewCount || 0).toLocaleString()], ["Type", lead.category], ["Website", isGo3 ? "Go3 Template" : lead.website ? "Has website" : "None"]].map(([l, v]) => (
                  <div key={l} className="bg-gray-50 rounded-xl p-3">
                    <div className="text-xs text-gray-400 mb-0.5">{l}</div>
                    <div className={"font-bold text-sm truncate " + (isGo3 && l === "Website" ? "text-red-600" : "")}>{v}</div>
                  </div>
                ))}
              </div>

              <div className="bg-white border border-gray-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">What I Actually See</div>
                <div className="space-y-2">
                  <div>
                    <div className="text-xs text-gray-400 mb-1">Website Quality</div>
                    <div className="flex gap-2 flex-wrap">
                      {["None", "Go3 Site", "Bad", "Basic", "Decent", "Good"].map(o => (
                        <button key={o} onClick={() => onUpdate({ ...lead, manualWebsite: o, isGo3: o === "Go3 Site" })}
                          className={"text-xs px-3 py-1.5 rounded-full border font-semibold " + (lead.manualWebsite === o ? "bg-black text-white border-black" : "border-gray-200 text-gray-600")}>
                          {o}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400 mb-1">Instagram</div>
                    <div className="flex gap-2 flex-wrap">
                      {["None", "Inactive", "Active", "Very Active"].map(o => (
                        <button key={o} onClick={() => onUpdate({ ...lead, manualInstagram: o })}
                          className={"text-xs px-3 py-1.5 rounded-full border font-semibold " + (lead.manualInstagram === o ? "bg-black text-white border-black" : "border-gray-200 text-gray-600")}>
                          {o}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {!a ? (
                <button onClick={doAnalyze} disabled={analyzing}
                  className="w-full bg-black text-white py-3 rounded-xl font-bold text-sm disabled:opacity-50">
                  {analyzing ? "Analyzing..." : "Analyze This Lead with AI"}
                </button>
              ) : (
                <div className="space-y-3">
                  <div className="bg-black text-white rounded-xl p-3">
                    <div className="text-xs text-gray-400 mb-1">Pitch Angle</div>
                    <div className="text-sm font-semibold">{a.pitchAngle}</div>
                  </div>
                  {isGo3 && a.go3Pitch && (
                    <div className="bg-red-50 border border-red-200 rounded-xl p-3">
                      <div className="text-xs font-semibold text-red-600 mb-1">Go3 Upgrade Pitch</div>
                      <div className="text-sm">{a.go3Pitch}</div>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <div className={"rounded-xl p-3 border " + (a.websiteOpp === "High" ? "bg-emerald-50 border-emerald-200" : "bg-gray-50 border-gray-100")}>
                      <div className="text-xs text-gray-400">Website Opp</div>
                      <div className="font-black text-lg">{a.websiteOpp}</div>
                      {a.biggestOpportunity && <div className="text-xs text-gray-500 mt-1">{a.biggestOpportunity}</div>}
                    </div>
                    <div className={"rounded-xl p-3 border " + (a.appOpp === "High" ? "bg-emerald-50 border-emerald-200" : "bg-gray-50 border-gray-100")}>
                      <div className="text-xs text-gray-400">App Opp</div>
                      <div className="font-black text-lg">{a.appOpp}</div>
                      {a.appIdea && <div className="text-xs text-gray-500 mt-1">{a.appIdea}</div>}
                    </div>
                  </div>
                  {a.aiAutomation && (
                    <div className="bg-purple-50 border border-purple-200 rounded-xl p-3">
                      <div className="text-xs font-semibold text-purple-600 mb-1">AI Automation Opportunity</div>
                      <div className="text-sm font-semibold mb-1">{a.aiAutomation}</div>
                      {a.aiPitch && <div className="text-xs text-purple-700 italic">"{a.aiPitch}"</div>}
                    </div>
                  )}
                  {a.competitorAngle && (
                    <div className="bg-orange-50 border border-orange-100 rounded-xl p-3">
                      <div className="text-xs font-semibold text-orange-600 mb-1">Competitor Angle</div>
                      <div className="text-sm">{a.competitorAngle}</div>
                    </div>
                  )}
                  <div className="space-y-1">
                    {a.problems?.map((p, i) => (
                      <div key={i} className="text-sm text-red-700 flex gap-2"><span>!</span><span>{p}</span></div>
                    ))}
                  </div>
                  <div className="bg-gray-50 rounded-xl p-3 text-sm text-gray-600">{a.summary}</div>
                  <button onClick={doAnalyze} disabled={analyzing} className="text-xs text-gray-400 hover:text-gray-600 underline">Re-analyze</button>
                </div>
              )}

              <div>
                <label className="text-xs font-semibold text-gray-400 block mb-1">Status</label>
                <select value={status} onChange={e => setStatus(e.target.value)} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                  {STATUSES.map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
            </div>
          )}

          {tab === "outreach" && (
            <div className="space-y-3">
              <div className="bg-black text-white rounded-xl p-3">
                <div className="text-xs text-gray-400 mb-2 font-semibold">Your Outreach Sequence</div>
                {[
                  { step: 1, channel: "Call", when: "Call first — fastest path" },
                  { step: 2, channel: "Email", when: "Same day or day after" },
                ].map(s => (
                  <div key={s.step} className="flex items-center gap-2 mt-1.5">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black flex-shrink-0 bg-green-400 text-black">{s.step}</div>
                    <span className="text-sm font-semibold text-green-400">{s.channel}</span>
                    <span className="text-xs text-gray-400 ml-auto">{s.when}</span>
                  </div>
                ))}
              </div>

              {(lead.contactLog || []).length > 0 && (
                <div className="bg-white border border-gray-100 rounded-xl p-3">
                  <div className="text-xs font-semibold text-gray-400 mb-2">Contact History</div>
                  {(lead.contactLog || []).map((log, i) => (
                    <div key={i} className="flex items-center gap-2 text-xs py-1.5 border-b border-gray-50 last:border-0">
                      <div className={"w-2 h-2 rounded-full flex-shrink-0 " + (log.type === "outreach" ? "bg-blue-400" : "bg-orange-400")}></div>
                      <span className="font-semibold text-gray-700">{log.channel}</span>
                      <span className="text-gray-400">{log.type}</span>
                      <span className="text-gray-300 ml-auto">{log.date}</span>
                    </div>
                  ))}
                </div>
              )}

              {channels.map(ch => (
                <div key={ch.key} className="border border-gray-100 rounded-xl p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-bold">{ch.label}</span>
                    <div className="flex gap-1">
                      {ch.key === "Instagram DM" && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">First</span>}
                      {ch.key === "Email" && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">Day 1</span>}
                      {(lead.contactLog || []).some(l => l.channel === ch.key) && <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">Sent</span>}
                    </div>
                  </div>
                  {lead.outreach?.[ch.key] ? (
                    <div className="space-y-2">
                      <div className="bg-white border border-gray-100 rounded-lg p-3 text-sm whitespace-pre-wrap leading-relaxed">{lead.outreach[ch.key]}</div>
                      <div className="flex gap-2 flex-wrap">
                        <CopyBtn text={lead.outreach[ch.key]} />
                        <button onClick={() => doGen(ch.key)} disabled={!!genFor} className="text-xs text-blue-600 hover:underline disabled:opacity-50">Regenerate</button>
                        {!(lead.contactLog || []).some(l => l.channel === ch.key && l.type === "outreach") && (
                          <button onClick={() => markSent(ch.key)} className="text-xs bg-black text-white px-3 py-1.5 rounded-lg font-semibold">Mark as Sent</button>
                        )}
                      </div>
                      <div className="flex gap-2">
                        <input value={fixInput[ch.key] || ""} onChange={e => setFixInput(prev => ({ ...prev, [ch.key]: e.target.value }))}
                          onKeyDown={e => e.key === "Enter" && doFix(ch.key)}
                          placeholder='Tell AI what to fix — e.g. "make it shorter" or "they have online ordering"'
                          className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-xs" />
                        <button onClick={() => doFix(ch.key)} disabled={fixing === ch.key || !fixInput[ch.key]?.trim()}
                          className="text-xs bg-purple-600 text-white px-3 py-1.5 rounded-lg font-semibold disabled:opacity-40 whitespace-nowrap">
                          {fixing === ch.key ? "..." : "Fix it"}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => doGen(ch.key)} disabled={!!genFor}
                      className="w-full border border-dashed border-gray-200 hover:bg-gray-50 py-2.5 rounded-lg text-sm text-gray-500 disabled:opacity-40">
                      {genFor === ch.key ? "Writing..." : "Generate " + ch.label + " Message"}
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}

          {tab === "call" && (
            <div className="space-y-3">
              <div className="bg-black text-white rounded-xl p-3">
                <div className="text-xs text-gray-400 mb-1">Call Script for</div>
                <div className="font-black text-lg">{lead.name}</div>
                <div className="text-xs text-gray-400 mt-1">Call Day 1 — same day as DM and email</div>
                {lead.phone && <a href={"tel:" + lead.phone} className="mt-3 flex items-center gap-2 bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-sm w-fit">{lead.phone} — Tap to Call</a>}
              </div>
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-emerald-700 mb-2">Opener</div>
                <div className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{script.opener}</div>
              </div>
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3">
                <div className="text-xs font-semibold text-blue-700 mb-2">The Hook</div>
                <div className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{script.hook}</div>
              </div>
              <div className="bg-white border border-gray-100 rounded-xl p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">Handle Objections</div>
                <div className="space-y-1">
                  {script.objections.map((obj, i) => (
                    <div key={i}>
                      <button onClick={() => setShowScript(showScript === i ? null : i)}
                        className="w-full text-left text-sm font-semibold text-gray-700 py-2 border-b border-gray-50 flex items-center justify-between">
                        <span>"{obj.q}"</span><span className="text-gray-400">{showScript === i ? "▲" : "▼"}</span>
                      </button>
                      {showScript === i && <div className="text-sm text-gray-600 leading-relaxed mt-2 bg-gray-50 rounded-lg p-3">{obj.a}</div>}
                    </div>
                  ))}
                </div>
              </div>
              <div className="bg-purple-50 border border-purple-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-purple-700 mb-2">Close</div>
                <div className="text-sm leading-relaxed text-gray-700">{script.close}</div>
              </div>
              <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-yellow-700 mb-2">Live Q&A — They said something unexpected?</div>
                <div className="flex gap-2">
                  <input value={liveQ} onChange={e => setLiveQ(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && doLiveQA()}
                    placeholder='Type what they just said...'
                    className="flex-1 border border-yellow-200 bg-white rounded-lg px-3 py-2 text-xs" />
                  <button onClick={doLiveQA} disabled={liveLoading || !liveQ.trim()}
                    className="text-xs bg-yellow-600 text-white px-3 py-2 rounded-lg font-semibold disabled:opacity-40 whitespace-nowrap">
                    {liveLoading ? "..." : "What to say"}
                  </button>
                </div>
                {liveA && <div className="mt-2 bg-white border border-yellow-200 rounded-lg p-3 text-sm font-medium text-gray-800">"{liveA}"</div>}
              </div>
              <div className="bg-gray-50 rounded-xl p-3 text-xs text-gray-500 leading-relaxed">
                <strong>Tips:</strong> Smile when you talk — they can hear it. If they say no, ask why. Volume wins — 20-40 calls a day.
              </div>
              <button onClick={() => {
                const log = [...(lead.contactLog || []), { channel: "Phone Call", date: new Date().toLocaleDateString(), type: "outreach" }];
                onUpdate({ ...lead, contactLog: log, status: "Contacted" });
              }} className="w-full bg-black text-white py-2.5 rounded-xl font-bold text-sm">
                Mark Call as Done
              </button>
            </div>
          )}

          {tab === "follow-up" && (
            <div className="space-y-3">
              <div className="bg-gray-50 rounded-xl p-3 text-sm text-gray-500">Generate outreach first, then follow-ups.</div>
              {channels.filter(ch => lead.outreach?.[ch.key]).map(ch => (
                <div key={ch.key} className="border border-gray-100 rounded-xl p-3 space-y-2">
                  <div className="text-sm font-bold">{ch.label} Follow-Up</div>
                  <div className="bg-gray-50 rounded-lg p-2 text-xs text-gray-500 italic line-clamp-2">{lead.outreach[ch.key]}</div>
                  {lead.outreach?.[ch.key + "_fu"] ? (
                    <div className="space-y-2">
                      <div className="bg-white border border-gray-100 rounded-lg p-3 text-sm whitespace-pre-wrap">{lead.outreach[ch.key + "_fu"]}</div>
                      <div className="flex gap-2">
                        <CopyBtn text={lead.outreach[ch.key + "_fu"]} />
                        <button onClick={() => doFu(ch.key)} disabled={!!genFuFor} className="text-xs text-blue-600 hover:underline disabled:opacity-50">Regenerate</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => doFu(ch.key)} disabled={!!genFuFor}
                      className="w-full border border-dashed border-gray-200 hover:bg-gray-50 py-2.5 rounded-lg text-sm text-gray-500 disabled:opacity-40">
                      {genFuFor === ch.key ? "Writing..." : "Generate Follow-Up"}
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}

          {tab === "upsell" && (
            <div className="space-y-3">
              <div className="bg-black text-white rounded-xl p-3">
                <div className="text-xs text-gray-400 mb-1">Max monthly value if fully upsold</div>
                <div className="text-2xl font-black">$850/mo</div>
                <div className="text-xs text-gray-400 mt-1">Plus one-time website fee</div>
              </div>
              {upsell.map(p => (
                <div key={p.num} className={"border rounded-xl p-3 " + (p.hot ? "border-emerald-200 bg-emerald-50" : "border-gray-100 bg-white")}>
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2">
                      <div className={"w-7 h-7 rounded-full flex items-center justify-center text-xs font-black flex-shrink-0 " + (p.hot ? "bg-emerald-500 text-white" : "bg-gray-100 text-gray-500")}>{p.num}</div>
                      <div>
                        <div className="font-bold text-sm">{p.name}</div>
                        <div className={"text-xs font-semibold " + (p.hot ? "text-emerald-600" : "text-gray-400")}>{p.tag}</div>
                      </div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      {p.price && <div className="text-sm font-bold">{p.price}</div>}
                      {p.monthly && <div className="text-sm font-bold text-emerald-600">{p.monthly}</div>}
                    </div>
                  </div>
                  <div className="text-xs text-gray-600 mb-1.5">{p.desc}</div>
                  <div className="text-xs text-blue-600 font-semibold">When: {p.when}</div>
                </div>
              ))}
            </div>
          )}

          {tab === "notes" && (
            <div className="space-y-3">
              <textarea value={notes} onChange={e => setNotes(e.target.value)}
                placeholder="Your notes on this lead..."
                className="w-full border border-gray-200 rounded-xl p-3 text-sm h-40 resize-none" />
              <div>
                <label className="text-xs font-semibold text-gray-400 block mb-1">Follow-Up Date</label>
                <input type="date" value={lead.followUpDate || ""}
                  onChange={e => onUpdate({ ...lead, followUpDate: e.target.value })}
                  className="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
              </div>
            </div>
          )}

        </div>

        <div className="p-4 border-t border-gray-100 flex gap-2 flex-shrink-0">
          <button onClick={() => { onUpdate({ ...lead, status, userNotes: notes }); onClose(); }}
            className="flex-1 bg-black text-white py-2.5 rounded-xl font-bold text-sm">Save and Close</button>
          <button onClick={onClose} className="px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600">Discard</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const { leads, save, history, addHistory } = useStorage();
  const [tab, setTab] = useState("search");
  const [searching, setSearching] = useState(false);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState("No Website");
  const [error, setError] = useState("");
  const [niche, setNiche] = useState("");
  const [city, setCity] = useState("");
  const [ideas, setIdeas] = useState([]);
  const [loadingIdeas, setLoadingIdeas] = useState(false);

  const today = new Date().toISOString().slice(0, 10);
  const followUps = leads.filter(l => l.followUpDate && l.followUpDate <= today && !["Closed/Won", "Closed/Lost"].includes(l.status));
  const hotLeads = leads.filter(l => (l.analysis?.score || 0) >= 70 && l.status === "New");

  const [currentSearch, setCurrentSearch] = useState("");

  const filtered = leads.filter(l => {
    if (filter === "No Website") return !l.website && l.status === "New";
    return l.status === "New";
  }).sort((a, b) => (b.analysis?.score || 0) - (a.analysis?.score || 0));

  const contacted = leads.filter(l => l.status !== "New").sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));

  const addResults = (results) => {
    const keys = new Set(leads.map(l => (l.name + "__" + l.address).toLowerCase()));
    const fresh = results.filter(r => !keys.has((r.name + "__" + r.address).toLowerCase()));
    save([...fresh, ...leads]);
  };

  const handleSearch = async () => {
    if (!niche || !city) return;
    setSearching(true); setError("");
    try {
      const results = await searchBusinesses(niche.trim(), city.trim());
      addResults(results);
      addHistory(niche.trim() + " in " + city.trim());
      setCurrentSearch(niche.trim() + " in " + city.trim());
      setFilter("All");
      setTab("leads");
    } catch(e) { setError("Search failed: " + e.message); }
    setSearching(false);
  };

  const handleGetIdeas = async () => {
    setLoadingIdeas(true);
    try { setIdeas(await getIdeas(history)); } catch { setError("Could not load ideas."); }
    setLoadingIdeas(false);
  };

  const updateLead = (u) => { save(leads.map(l => l.id === u.id ? u : l)); setSelected(u); };
  const toggleCheck = (id, unarchive) => save(leads.map(l => l.id === id ? (unarchive ? { ...l, archived: false } : { ...l, checked: !l.checked }) : l));

  return (
    <div className="min-h-screen bg-gray-50">
      <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-40 flex items-center justify-between">
        <div>
          <div className="font-black text-lg tracking-tight">Zova Digital</div>
          <div className="text-xs text-gray-400">Lead Manager</div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => exportLeads(leads)} className="text-xs border border-gray-200 px-3 py-1.5 rounded-lg font-semibold text-gray-600 hover:bg-gray-50">Export</button>
          <label className="text-xs border border-gray-200 px-3 py-1.5 rounded-lg font-semibold text-gray-600 hover:bg-gray-50 cursor-pointer">
            Import<input type="file" accept=".json" className="hidden" onChange={e => e.target.files[0] && importLeads(e.target.files[0], leads, save)} />
          </label>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-4 pb-24 space-y-3">

        {tab === "search" && (
          <div className="space-y-3">
            <div className="bg-white border border-gray-100 rounded-2xl p-4 space-y-3">
              <h2 className="font-black text-lg">Find New Leads</h2>
              <div>
                <label className="text-xs font-semibold text-gray-500 block mb-1">Business Type</label>
                <input value={niche} onChange={e => setNiche(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSearch()}
                  placeholder="e.g. Nail salons, Restaurants, Ice cream shops"
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
              </div>
              <div>
                <label className="text-xs font-semibold text-gray-500 block mb-1">City / Area</label>
                <input value={city} onChange={e => setCity(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSearch()}
                  placeholder="e.g. Flushing Queens, Brooklyn NY"
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
              </div>
              {error && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700">{error}</div>}
              <button onClick={handleSearch} disabled={searching || !niche || !city}
                className="w-full py-3 rounded-xl font-bold disabled:opacity-40 bg-black text-white">
                {searching ? "Finding businesses..." : "Find Businesses"}
              </button>
            </div>
            {history.length > 0 && (
              <div className="bg-white border border-gray-100 rounded-2xl p-4">
                <div className="text-xs font-semibold text-gray-400 mb-2">Recent</div>
                <div className="flex flex-wrap gap-2">
                  {history.slice(0, 8).map(h => {
                    const p = h.split(" in ");
                    return <button key={h} onClick={() => { setNiche(p[0]); setCity(p.slice(1).join(" in ")); }}
                      className="text-xs bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-full hover:bg-gray-100">{h}</button>;
                  })}
                </div>
              </div>
            )}
            <div className="bg-white border border-gray-100 rounded-2xl p-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs font-semibold text-gray-400">Search Ideas</div>
                <button onClick={handleGetIdeas} disabled={loadingIdeas} className="text-xs text-blue-600 font-semibold disabled:opacity-50">
                  {loadingIdeas ? "Loading..." : ideas.length > 0 ? "Refresh" : "Generate for me"}
                </button>
              </div>
              {ideas.length > 0 ? (
                <div className="flex flex-wrap gap-2">
                  {ideas.map(idea => {
                    const p = idea.split(" in ");
                    const done = history.map(h => h.toLowerCase()).includes(idea.toLowerCase());
                    return <button key={idea} onClick={() => { setNiche(p[0]); setCity(p.slice(1).join(" in ")); }}
                      className={"text-xs px-3 py-1.5 rounded-full border " + (done ? "bg-gray-50 border-gray-200 text-gray-400 line-through" : "bg-blue-50 border-blue-100 text-blue-800 hover:bg-blue-100")}>
                      {idea}
                    </button>;
                  })}
                </div>
              ) : <div className="text-xs text-gray-400">AI suggests fresh searches based on what you have already done.</div>}
            </div>
          </div>
        )}

        {tab === "leads" && (
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-black text-lg">New Leads</h2>
              {filtered.length > 0 && (
                <button onClick={() => {
                  if (confirm("Remove all uncontacted leads? Your contacted leads stay in the Contacted tab.")) {
                    save(leads.filter(l => l.status !== "New"));
                  }
                }} className="text-xs text-red-400 border border-red-200 px-2 py-1 rounded-lg">Clear</button>
              )}
            </div>
            <div className="flex gap-2 overflow-x-auto pb-1">
              {["All", "No Website"].map(s => (
                <button key={s} onClick={() => setFilter(s)}
                  className={"text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-semibold flex-shrink-0 " + (filter === s ? "bg-black text-white" : s === "No Website" ? "bg-red-50 border border-red-200 text-red-700" : "bg-white border border-gray-200 text-gray-600")}>
                  {s}
                </button>
              ))}
            </div>
            {filtered.length === 0 ? (
              <div className="bg-white border border-gray-100 rounded-2xl p-8 text-center">
                <div className="font-bold mb-1">No new leads</div>
                <div className="text-sm text-gray-400">Search for businesses to get started.</div>
              </div>
            ) : filtered.map(l => <LeadCard key={l.id} lead={l} onClick={() => setSelected(l)} onCheck={toggleCheck} />)}
          </div>
        )}

        {tab === "contacted" && (
          <div className="space-y-3">
            <h2 className="font-black text-lg">Contacted ({contacted.length})</h2>
            <div className="flex gap-2 overflow-x-auto pb-1">
              {["All", ...STATUSES.filter(s => s !== "New")].map(s => (
                <button key={s} onClick={() => setFilter(s)}
                  className={"text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-semibold flex-shrink-0 " + (filter === s ? "bg-black text-white" : "bg-white border border-gray-200 text-gray-600")}>
                  {s}
                </button>
              ))}
            </div>
            {contacted.filter(l => filter === "All" || l.status === filter).length === 0 ? (
              <div className="bg-white border border-gray-100 rounded-2xl p-8 text-center">
                <div className="font-bold mb-1">No contacted leads yet</div>
                <div className="text-sm text-gray-400">Mark leads as sent to see them here.</div>
              </div>
            ) : contacted.filter(l => filter === "All" || l.status === filter).map(l => <LeadCard key={l.id} lead={l} onClick={() => setSelected(l)} onCheck={toggleCheck} />)}
          </div>
        )}

        {tab === "dashboard" && (
          <div className="space-y-4">
            <div>
              <h1 className="text-2xl font-black">Today</h1>
              <p className="text-sm text-gray-400">{new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</p>
            </div>
            <div className="grid grid-cols-2 gap-3">
              {[
                { label: "Hot leads", count: hotLeads.length, color: "bg-red-50 border-red-100" },
                { label: "Follow-ups due", count: followUps.length, color: "bg-yellow-50 border-yellow-100" },
                { label: "Interested", count: leads.filter(l => l.status === "Interested").length, color: "bg-green-50 border-green-100" },
                { label: "No website", count: leads.filter(l => !l.website || l.websiteQuality === "none").length, color: "bg-orange-50 border-orange-100" },
                { label: "Contacted", count: leads.filter(l => l.status === "Contacted").length, color: "bg-blue-50 border-blue-100" },
                { label: "Total leads", count: leads.length, color: "bg-gray-50 border-gray-100" },
              ].map(s => (
                <div key={s.label} className={"border rounded-2xl p-4 " + s.color}>
                  <div className="text-2xl font-black">{s.count}</div>
                  <div className="text-xs text-gray-500 mt-0.5">{s.label}</div>
                </div>
              ))}
            </div>
            {leads.length === 0 && (
              <div className="bg-gray-50 border border-gray-100 rounded-2xl p-8 text-center">
                <div className="font-black text-lg mb-1">Welcome to Zova Digital</div>
                <div className="text-sm text-gray-400">Search for businesses to get started.</div>
              </div>
            )}
          </div>
        )}

        {tab === "notes" && (
          <div className="space-y-3">
            <h2 className="font-black text-lg">All Notes</h2>
            {leads.filter(l => l.userNotes && l.userNotes.trim()).length === 0 ? (
              <div className="bg-white border border-gray-100 rounded-2xl p-8 text-center">
                <div className="font-bold mb-1">No notes yet</div>
                <div className="text-sm text-gray-400">Open a lead and add notes in the Notes tab.</div>
              </div>
            ) : leads.filter(l => l.userNotes && l.userNotes.trim()).map(l => (
              <div key={l.id} onClick={() => setSelected(l)} className="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:shadow-md">
                <div className="flex items-start justify-between gap-2 mb-2">
                  <div className="font-bold text-sm">{l.name}</div>
                  <span className={"text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 " + STATUS_COLORS[l.status]}>{l.status}</span>
                </div>
                <div className="text-sm text-gray-600 leading-relaxed">{l.userNotes}</div>
                <div className="text-xs text-gray-300 mt-2">{l.address}</div>
              </div>
            ))}
          </div>
        )}

        {tab === "followups" && (
          <div className="space-y-3">
            <h2 className="font-black text-lg">Follow-Ups</h2>
            {followUps.length === 0 ? (
              <div className="bg-white border border-gray-100 rounded-2xl p-8 text-center">
                <div className="font-bold mb-1">No follow-ups due</div>
                <div className="text-sm text-gray-400">Set follow-up dates inside leads.</div>
              </div>
            ) : followUps.map(l => (
              <div key={l.id} onClick={() => setSelected(l)} className="bg-white border border-gray-100 rounded-2xl p-4 cursor-pointer hover:shadow-md">
                <div className="flex justify-between items-start gap-2">
                  <div className="min-w-0">
                    <div className="font-bold truncate">{l.name}</div>
                    <div className="text-xs text-gray-400 truncate">{l.address}</div>
                    <div className="text-xs text-red-500 font-semibold mt-1">Follow up: {l.followUpDate}</div>
                  </div>
                  <span className={"text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 " + STATUS_COLORS[l.status]}>{l.status}</span>
                </div>
              </div>
            ))}
          </div>
        )}

      </div>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-40">
        <div className="max-w-2xl mx-auto flex">
          {[
            { id: "search", label: "Search" },
            { id: "leads", label: "Leads" + (filtered.length ? " (" + filtered.length + ")" : "") },
            { id: "contacted", label: "Contacted" + (contacted.length ? " (" + contacted.length + ")" : "") },
            { id: "dashboard", label: "Home" },
            { id: "notes", label: "Notes" },
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={"flex-1 py-3 text-xs font-semibold " + (tab === t.id ? "text-black" : "text-gray-400")}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {selected && <LeadModal lead={leads.find(l => l.id === selected.id) || selected} onClose={() => setSelected(null)} onUpdate={updateLead} />}
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
